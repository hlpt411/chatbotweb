<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PTBot — Trợ lý AI tiếng Việt · Tạo bởi PT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-primary: #0a0a0f; --bg-secondary: #12121a; --bg-tertiary: #1a1a26; --bg-elevated: #22222f;
    --accent-primary: #7c5cff; --accent-secondary: #5b8def; --accent-glow: rgba(124, 92, 255, 0.3);
    --text-primary: #f5f5fa; --text-secondary: #b0b0c0; --text-tertiary: #7a7b90;
    --border-subtle: rgba(255, 255, 255, 0.07); --border-medium: rgba(255, 255, 255, 0.14);
    --success: #4ade80; --error: #f87171; --warn: #fbbf24; --code-bg: #0a0a12;
    --user-bubble: linear-gradient(135deg, #7c5cff 0%, #5b8def 100%); --bot-bubble: #15151f;
  }
  html, body { height: 100%; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-primary); color: var(--text-primary); overflow: hidden; -webkit-font-smoothing: antialiased; }
  body { background-image: radial-gradient(circle at 15% 20%, rgba(124, 92, 255, 0.1) 0%, transparent 45%), radial-gradient(circle at 85% 80%, rgba(91, 141, 239, 0.08) 0%, transparent 45%); background-attachment: fixed; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(124, 92, 255, 0.4); }
  .app-container { display: flex; height: 100vh; max-width: 1400px; margin: 0 auto; }
  .sidebar { width: 280px; background: rgba(18, 18, 26, 0.85); border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column; padding: 20px; transition: transform 0.3s ease; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  .sidebar-header { display: flex; align-items: center; gap: 12px; padding-bottom: 20px; border-bottom: 1px solid var(--border-subtle); margin-bottom: 20px; }
  .logo-mark { width: 42px; height: 42px; border-radius: 12px; background: var(--user-bubble); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; color: white; box-shadow: 0 4px 20px var(--accent-glow); position: relative; overflow: hidden; }
  .logo-mark::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); }
  .logo-text { font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }
  .logo-sub { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
  .new-chat-btn { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--bg-elevated); border: 1px solid var(--border-medium); border-radius: 10px; color: var(--text-primary); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; margin-bottom: 16px; }
  .new-chat-btn:hover { background: var(--accent-primary); border-color: var(--accent-primary); transform: translateY(-1px); box-shadow: 0 4px 16px var(--accent-glow); }
  .new-chat-btn svg { width: 16px; height: 16px; }
  .chat-history { flex: 1; overflow-y: auto; margin-bottom: 16px; }
  .history-item { padding: 10px 14px; border-radius: 8px; font-size: 13px; color: var(--text-secondary); cursor: pointer; margin-bottom: 4px; transition: all 0.2s ease; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; border: 1px solid transparent; }
  .history-item:hover { background: var(--bg-tertiary); color: var(--text-primary); border-color: var(--border-subtle); }
  .history-item.active { background: var(--bg-tertiary); color: var(--text-primary); border-color: var(--border-medium); }
  .history-item svg { width: 14px; height: 14px; flex-shrink: 0; }
  .history-item .del-btn { background: none; border: none; color: var(--text-tertiary); cursor: pointer; padding: 0; width: 22px; height: 22px; display: none; align-items: center; justify-content: center; border-radius: 4px; flex-shrink: 0; }
  .history-item:hover .del-btn { display: flex; }
  .history-item .del-btn:hover { background: rgba(248, 113, 113, 0.15); color: var(--error); }
  .sidebar-footer { padding-top: 16px; border-top: 1px solid var(--border-subtle); }
  .creator-badge { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: linear-gradient(135deg, rgba(124, 92, 255, 0.1), rgba(91, 141, 239, 0.06)); border: 1px solid rgba(124, 92, 255, 0.25); border-radius: 10px; margin-bottom: 12px; }
  .creator-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--user-bubble); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; color: white; flex-shrink: 0; box-shadow: 0 2px 8px var(--accent-glow); }
  .creator-text { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
  .creator-name { color: var(--text-primary); font-weight: 600; font-size: 13px; }
  .creator-role { color: var(--text-tertiary); font-size: 10px; }
  .status-indicator { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-tertiary); padding: 8px 12px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 10px var(--success); animation: pulse 2s ease infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.9); } }
  .chat-main { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; }
  .chat-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-bottom: 1px solid var(--border-subtle); background: rgba(10, 10, 15, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); z-index: 10; }
  .model-info { display: flex; align-items: center; gap: 12px; }
  .model-avatar { width: 38px; height: 38px; border-radius: 11px; background: var(--user-bubble); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; box-shadow: 0 2px 12px var(--accent-glow); position: relative; overflow: hidden; }
  .model-avatar::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); }
  .model-name { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .model-pill { background: rgba(124, 92, 255, 0.15); border: 1px solid rgba(124, 92, 255, 0.3); border-radius: 999px; padding: 3px 9px; font-size: 10px; color: #b8a8ff; font-weight: 500; letter-spacing: 0.3px; }
  .model-meta { font-size: 12px; color: var(--text-tertiary); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); display: inline-block; }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 8px; background: var(--bg-tertiary); border: 1px solid var(--border-subtle); color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }
  .icon-btn:hover { background: var(--bg-elevated); color: var(--text-primary); border-color: var(--border-medium); }
  .icon-btn svg { width: 16px; height: 16px; }
  .messages-container { flex: 1; overflow-y: auto; padding: 24px; scroll-behavior: smooth; }
  .message-wrapper { max-width: 820px; margin: 0 auto 28px; animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .message-wrapper.user { display: flex; justify-content: flex-end; }
  .message { display: flex; gap: 14px; align-items: flex-start; }
  .message-wrapper.user .message { flex-direction: row-reverse; }
  .msg-avatar { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0; }
  .message-wrapper.bot .msg-avatar { background: var(--user-bubble); color: white; box-shadow: 0 2px 10px var(--accent-glow); position: relative; overflow: hidden; }
  .message-wrapper.bot .msg-avatar::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); }
  .message-wrapper.user .msg-avatar { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border-medium); }
  .msg-content-stack { display: flex; flex-direction: column; gap: 12px; max-width: 80%; }
  .msg-bubble { padding: 14px 18px; border-radius: 18px; font-size: 15px; line-height: 1.65; word-wrap: break-word; overflow-wrap: break-word; }
  .message-wrapper.user .msg-bubble { background: var(--user-bubble); color: white; border-bottom-right-radius: 5px; box-shadow: 0 4px 18px var(--accent-glow); }
  .message-wrapper.bot .msg-bubble { background: var(--bot-bubble); color: var(--text-primary); border: 1px solid var(--border-subtle); border-bottom-left-radius: 5px; }
  .msg-content { font-size: 15px; }
  .msg-content > *:first-child { margin-top: 0; }
  .msg-content > *:last-child { margin-bottom: 0; }
  .msg-content p { margin-bottom: 10px; }
  .msg-content p:last-child { margin-bottom: 0; }
  .msg-content strong { font-weight: 600; color: #fff; }
  .msg-content em { font-style: italic; }
  .msg-content a { color: #a8b8ff; text-decoration: none; border-bottom: 1px solid rgba(168, 184, 255, 0.3); transition: border-color 0.2s; }
  .msg-content a:hover { border-bottom-color: #a8b8ff; }
  .msg-content ul, .msg-content ol { padding-left: 22px; margin: 10px 0; }
  .msg-content li { margin-bottom: 5px; }
  .msg-content li::marker { color: var(--accent-primary); }
  .msg-content h1, .msg-content h2, .msg-content h3 { margin: 16px 0 10px; font-weight: 600; line-height: 1.3; color: #fff; }
  .msg-content h1 { font-size: 22px; }
  .msg-content h2 { font-size: 19px; }
  .msg-content h3 { font-size: 17px; }
  .msg-content blockquote { border-left: 3px solid var(--accent-primary); padding-left: 14px; margin: 10px 0; color: var(--text-secondary); font-style: italic; }
  .msg-content :not(pre) > code { font-family: 'JetBrains Mono', monospace; background: rgba(124, 92, 255, 0.14); padding: 2px 7px; border-radius: 5px; font-size: 13px; color: #c9b8ff; border: 1px solid rgba(124, 92, 255, 0.2); }
  .code-card { background: var(--code-bg); border: 1px solid var(--border-subtle); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 18px rgba(0,0,0,0.3); }
  .code-card-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: rgba(255, 255, 255, 0.025); border-bottom: 1px solid var(--border-subtle); }
  .code-card-lang { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-secondary); font-family: 'JetBrains Mono', monospace; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
  .code-card-lang-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-primary); box-shadow: 0 0 8px var(--accent-primary); }
  .code-card-actions { display: flex; gap: 6px; }
  .code-action-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-subtle); color: var(--text-secondary); font-size: 11px; padding: 5px 11px; border-radius: 7px; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 5px; font-family: 'Inter', sans-serif; font-weight: 500; }
  .code-action-btn:hover { background: var(--accent-primary); border-color: var(--accent-primary); color: white; transform: translateY(-1px); }
  .code-action-btn.copied { background: var(--success); border-color: var(--success); color: #0a0a0f; }
  .code-action-btn svg { width: 12px; height: 12px; }
  .code-card pre { background: transparent; margin: 0; padding: 16px 18px; overflow-x: auto; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.65; color: #e0e0e8; max-height: 500px; }
  .code-card pre code { background: none; padding: 0; color: #e0e0e8; font-family: inherit; font-size: inherit; white-space: pre; display: block; }
  .typing-indicator { display: flex; gap: 5px; padding: 6px 0; }
  .typing-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-tertiary); animation: typing 1.4s ease infinite; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-7px); opacity: 1; } }
  .msg-actions { display: flex; gap: 6px; margin-top: 6px; opacity: 0; transition: opacity 0.2s ease; flex-wrap: wrap; padding: 0 4px; }
  .message-wrapper.bot:hover .msg-actions { opacity: 1; }
  .msg-action-btn { background: transparent; border: 1px solid var(--border-subtle); color: var(--text-tertiary); font-size: 11px; padding: 5px 10px; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 5px; }
  .msg-action-btn:hover { color: var(--text-primary); border-color: var(--border-medium); background: var(--bg-tertiary); }
  .msg-action-btn svg { width: 11px; height: 11px; }
  .welcome-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; text-align: center; }
  .welcome-logo { width: 84px; height: 84px; border-radius: 26px; background: var(--user-bubble); display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 700; color: white; margin-bottom: 24px; box-shadow: 0 12px 40px var(--accent-glow); animation: float 3s ease infinite; position: relative; overflow: hidden; }
  .welcome-logo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.25), transparent); }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .welcome-title { font-size: 34px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.02em; background: linear-gradient(135deg, #ffffff 0%, #b0b0c8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .welcome-credit { font-size: 14px; color: var(--text-tertiary); margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .welcome-credit strong { color: #b8a8ff; font-weight: 600; }
  .welcome-sub { font-size: 16px; color: var(--text-secondary); margin-bottom: 40px; max-width: 520px; line-height: 1.6; }
  .suggestions-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; max-width: 720px; width: 100%; }
  .suggestion-card { padding: 18px; background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: 14px; cursor: pointer; transition: all 0.2s ease; text-align: left; }
  .suggestion-card:hover { border-color: var(--accent-primary); background: var(--bg-tertiary); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
  .suggestion-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--accent-glow); display: flex; align-items: center; justify-content: center; margin-bottom: 12px; color: #b8a8ff; }
  .suggestion-icon svg { width: 18px; height: 18px; }
  .suggestion-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .suggestion-desc { font-size: 12px; color: var(--text-tertiary); line-height: 1.5; }
  .input-area { padding: 18px 24px 26px; background: linear-gradient(to top, var(--bg-primary) 50%, transparent); }
  .input-wrapper { max-width: 820px; margin: 0 auto; position: relative; background: var(--bg-secondary); border: 1px solid var(--border-medium); border-radius: 18px; transition: all 0.2s ease; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3); }
  .input-wrapper:focus-within { border-color: var(--accent-primary); box-shadow: 0 0 0 3px var(--accent-glow), 0 4px 24px rgba(0, 0, 0, 0.3); }
  .input-form { display: flex; align-items: flex-end; padding: 14px 16px; gap: 12px; }
  .input-field { flex: 1; background: transparent; border: none; outline: none; color: var(--text-primary); font-size: 15px; font-family: inherit; resize: none; max-height: 200px; line-height: 1.5; }
  .input-field::placeholder { color: var(--text-tertiary); }
  .send-btn { width: 40px; height: 40px; border-radius: 11px; background: var(--user-bubble); border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; flex-shrink: 0; box-shadow: 0 2px 10px var(--accent-glow); }
  .send-btn:hover:not(:disabled) { transform: scale(1.06); box-shadow: 0 4px 20px var(--accent-glow); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; background: var(--bg-elevated); box-shadow: none; }
  .send-btn svg { width: 18px; height: 18px; }
  .input-meta { display: flex; justify-content: space-between; align-items: center; padding: 0 18px 12px; font-size: 11px; color: var(--text-tertiary); }
  .input-hint { display: flex; gap: 14px; }
  .input-hint kbd { background: var(--bg-tertiary); border: 1px solid var(--border-subtle); border-radius: 4px; padding: 2px 6px; font-family: 'JetBrains Mono', monospace; font-size: 10px; }
  .mobile-menu-btn { display: none; width: 36px; height: 36px; border-radius: 8px; background: var(--bg-tertiary); border: 1px solid var(--border-subtle); color: var(--text-secondary); cursor: pointer; align-items: center; justify-content: center; }
  @media (max-width: 768px) {
    .sidebar { position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; transform: translateX(-100%); box-shadow: 4px 0 24px rgba(0, 0, 0, 0.5); }
    .sidebar.open { transform: translateX(0); }
    .mobile-menu-btn { display: flex; }
    .messages-container { padding: 16px; }
    .input-area { padding: 14px 16px 18px; }
    .msg-content-stack { max-width: 92%; }
    .suggestions-grid { grid-template-columns: 1fr; }
    .welcome-title { font-size: 26px; }
    .model-meta { display: none; }
    .input-meta { flex-direction: column; gap: 6px; align-items: flex-start; }
  }
  .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 99; backdrop-filter: blur(4px); }
  .sidebar-overlay.active { display: block; }
  .toast { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--bg-elevated); border: 1px solid var(--border-medium); color: var(--text-primary); padding: 10px 18px; border-radius: 10px; font-size: 13px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); opacity: 0; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none; z-index: 1000; display: flex; align-items: center; gap: 8px; max-width: 90%; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .error-detail { background: rgba(248, 113, 113, 0.08); border: 1px solid rgba(248, 113, 113, 0.2); border-radius: 8px; padding: 12px; margin-top: 8px; font-size: 12px; font-family: 'JetBrains Mono', monospace; color: #fca5a5; word-break: break-word; white-space: pre-wrap; }
  .retry-btn { background: var(--accent-primary); border: none; color: white; font-size: 12px; padding: 6px 14px; border-radius: 6px; cursor: pointer; margin-top: 8px; font-weight: 500; transition: all 0.2s; }
  .retry-btn:hover { background: var(--accent-secondary); transform: translateY(-1px); }
  .debug-info { font-size: 10px; color: var(--text-tertiary); margin-top: 8px; font-family: 'JetBrains Mono', monospace; opacity: 0.6; }
</style>
</head>
<body>
<div class="app-container">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-mark">PT</div>
      <div>
        <div class="logo-text">PTBot</div>
        <div class="logo-sub">Trợ lý AI tiếng Việt</div>
      </div>
    </div>
    <button class="new-chat-btn" onclick="newChat()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      Cuộc trò chuyện mới
    </button>
    <div class="chat-history" id="chatHistory"></div>
    <div class="sidebar-footer">
      <div class="creator-badge">
        <div class="creator-avatar">PT</div>
        <div class="creator-text">
          <div class="creator-name">PT</div>
          <div class="creator-role">Nhà phát triển PTBot</div>
        </div>
      </div>
      <div class="status-indicator">
        <div class="status-dot"></div>
        <span>PTBot v5.0 · Siêu thông minh</span>
      </div>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <main class="chat-main">
    <div class="chat-header">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="mobile-menu-btn" onclick="toggleSidebar()">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <div class="model-info">
          <div class="model-avatar">PT</div>
          <div>
            <div class="model-name">PTBot <span class="model-pill">v5.0 Elite</span></div>
            <div class="model-meta">
              <span class="live-dot"></span>
              Tạo bởi PT · Trợ lý AI tiếng Việt
            </div>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="clearAll()" title="Xóa tất cả">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
        </button>
      </div>
    </div>
    <div class="messages-container" id="messagesContainer"></div>
    <div class="input-area">
      <div class="input-wrapper">
        <form class="input-form" id="chatForm">
          <textarea class="input-field" id="messageInput" placeholder="Hỏi PTBot bất kỳ điều gì..." rows="1" oninput="autoResize(this)"></textarea>

function renderMessageHTML(msg, idx) {
  const isUser = msg.role === 'user';
  const avatar = isUser ? 'Bạn' : 'PT';
  const wrapperClass = isUser ? 'user' : 'bot';
  if (isUser) {
    return `<div class="message-wrapper ${wrapperClass}" data-idx="${idx}"><div class="message"><div class="msg-avatar">${avatar}</div><div class="msg-content-stack"><div class="msg-bubble"><div class="msg-content"><p>${escapeHtml(msg.content)}</p></div></div></div></div></div>`;
  }
  const parts = parseMessageParts(msg.content || '');
  let stack = '';
  parts.forEach((part) => {
    if (part.type === 'code') {
      const codeId = 'code_' + Math.random().toString(36).slice(2, 10);
      const langLabel = part.lang || 'code';
      stack += `<div class="code-card" data-code-id="${codeId}"><div class="code-card-header"><div class="code-card-lang"><span class="code-card-lang-dot"></span>${escapeHtml(langLabel)}</div><div class="code-card-actions"><button class="code-action-btn copy-code-btn" data-target="${codeId}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg><span>Sao chép</span></button></div></div><pre><code>${escapeHtml(part.content)}</code></pre></div>`;
    } else {
      stack += `<div class="msg-bubble"><div class="msg-content">${formatInlineMarkdown(part.content)}</div></div>`;
    }
  });
  const actions = `<div class="msg-actions"><button class="msg-action-btn" onclick="copyMessage(${idx})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Sao chép</button><button class="msg-action-btn" onclick="regenerateMessage(${idx})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>Tạo lại</button></div>`;
  return `<div class="message-wrapper ${wrapperClass}" data-idx="${idx}"><div class="message"><div class="msg-avatar">${avatar}</div><div class="msg-content-stack">${stack}${actions}</div></div></div>`;
}

function parseMessageParts(text) {
  const parts = [];
  if (!text) return parts;
  const codeBlockRegex = /```(\w*)\n([\s\S]*?)```/g;
  let lastIndex = 0;
  let match;
  while ((match = codeBlockRegex.exec(text)) !== null) {
    if (match.index > lastIndex) {
      const textPart = text.slice(lastIndex, match.index).trim();
      if (textPart) parts.push({ type: 'text', content: textPart });
    }
    parts.push({ type: 'code', lang: match[1] || 'code', content: match[2].trim() });
    lastIndex = match.index + match[0].length;
  }
  if (lastIndex < text.length) {
    const textPart = text.slice(lastIndex).trim();
    if (textPart) parts.push({ type: 'text', content: textPart });
  }
  return parts;
}

function formatInlineMarkdown(text) {
  if (!text) return '';
  let html = escapeHtml(text);
  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');
  html = html.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  html = html.replace(/^(?:[\-\*]|\d+\.) (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, (match) => '<ul>' + match + '</ul>');
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  html = html.split(/\n\n+/).map(p => { const t = p.trim(); if (!t) return ''; if (t.startsWith('<ul>') || t.startsWith('<h') || t.startsWith('<li>') || t.startsWith('<blockquote>')) return t; return '<p>' + t.replace(/\n/g, '<br>') + '</p>'; }).join('');
  return html;
}

function enhanceCodeBlocks() {
  document.querySelectorAll('.copy-code-btn').forEach(btn => {
    if (btn._wired) return;
    btn._wired = true;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const wrapper = btn.closest('.code-card');
      if (!wrapper) return;
      const code = wrapper.querySelector('code');
      if (!code) return;
      copyToClipboard(code.textContent, btn);
    });
  });
}

function copyToClipboard(text, btn) {
  if (!text) return;
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      if (btn) { btn.classList.add('copied'); btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg><span>Đã copy!</span>'; setTimeout(() => btn.classList.remove('copied'), 2000); }
      else showToast('Đã sao chép');
    } catch (err) { showToast('Lỗi sao chép'); }
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => {
      if (btn) { btn.classList.add('copied'); btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg><span>Đã copy!</span>'; setTimeout(() => btn.classList.remove('copied'), 2000); }
      else showToast('Đã sao chép');
    }).catch(fallback);
  } else { fallback(); }
}

function scrollToBottom() {
  const c = document.getElementById('messagesContainer');

}

function autoResize(ta) {

function useSuggestion(text) {

function appendMessageHTML(msg, idx) {
  const container = document.getElementById('messagesContainer');

  if (welcome) welcome.remove();

function showErrorInChat(errMsg, detail, canRetry) {

  container.insertAdjacentHTML('beforeend', html);

}

function showToast(msg) {
  const toast = document.getElementById('toast');

  toast._timer = setTimeout(() => toast.classList.remove('show'), 2200);

function sanitizeResponse(text) {
  if (!text) return text;
  let c = text;
  const patterns = [
    /(Tôi\s+là|Tôi\s+được\s+(tạo|phát\s+triển|huấn\s+luyện)\s+(bởi|by))[^.\n]*?(DeepSeek|deepseek)[^.\n]*?\.?/gi,
    /(As\s+(an?\s+)?(AI\s+)?(assistant\s+)?(made|developed|created|trained)\s+by)[^.\n]*?(DeepSeek|deepseek)[^.\n]*?\.?/gi,
    /I\s+am\s+(an?\s+)?(AI\s+)?(assistant\s+)?(made|developed|created)\s+by\s+(DeepSeek|deepseek)[^.]*\.?/gi,
    /(DeepSeek[^.\n]{0,80})\s+(model|AI|company|corp)/gi,
    /model\s+(ngôn\s+ngữ\s+)?(lớn\s+)?của\s+(DeepSeek|deepseek)[^.\n]*/gi,
    /Xin\s+lỗi[^.]*?(DeepSeek|deepseek)[^.]*\.?\s*/gi,
    /^(DeepSeek[^:]*:\s*)/gim,
    /Tôi\s+là\s+một\s+trợ\s+lý\s+AI[^.\n]*?(DeepSeek|deepseek)[^.\n]*\.?\s*/gi,
    /được\s+(phát\s+triển|tạo|huấn\s+luyện)\s+bởi\s+(DeepSeek|deepseek)[^.\n]*\.?\s*/gi,
    /dựa\s+trên\s+(DeepSeek|deepseek)[^.\n]*\.?\s*/gi,
    /phiên\s+bản\s+của\s+(DeepSeek|deepseek)[^.\n]*\.?\s*/gi,
    /(DeepSeek|deepseek)['"]?s?\s+(model|AI|technology)/gi,
    /được\s+(phát\s+triển|tạo|huấn\s+luyện)\s+bởi\s+(đội\s+ngũ|công\s+ty|tổ\s+chức|team|company|organization)[^.\n]*?\.?\s*/gi,
    /(developed|made)\s+by\s+(DeepSeek|deepseek)[^.]*\.?/gi
  ];
  patterns.forEach(p => { c = c.replace(p, ''); });
  c = c.replace(/^[Tt]ôi\s+là\s*\.?\s*$/gm, '');
  c = c.trim();
  return c || text;
}

async function callAPI(messages, signal) {
  const url = API_CONFIG.baseUrl + '/chat/completions';
  const body = JSON.stringify({
    model: API_CONFIG.model,
    messages: messages,
    stream: false,
    temperature: 0.7,
    max_tokens: 3000
  });
  const resp = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + API_CONFIG.apiKey
    },
    body: body,
    signal: signal
  });
  const txt = await resp.text();
  if (!resp.ok) {
    let errMsg = 'HTTP ' + resp.status;
    try {
      const errJson = JSON.parse(txt);
      errMsg = errJson.error?.message || errJson.message || txt.slice(0, 200);
    } catch (e) {
      errMsg = txt.slice(0, 200) || errMsg;
    }
    throw new Error(errMsg);
  }
  try {
    return JSON.parse(txt);
  } catch (e) {
    throw new Error('Phản hồi không hợp lệ từ server');
  }
}

async function sendMessage(event) {
  if (event) { event.preventDefault(); event.stopPropagation(); }
  if (state.isStreaming) { showToast('Đợi phản hồi xong'); return false; }

  const input = document.getElementById('messageInput');
  if (!input) { console.error('Input not found'); return false; }

  const text = (input.value || '').trim();
  if (!text) { showToast('Nhập tin nhắn trước'); return false; }

  if (!state.currentId) newChat();
  const conv = getCurrentConversation();
  if (!conv) { showToast('Lỗi: không tạo được cuộc trò chuyện'); return false; }

  const userMsg = { role: 'user', content: text, timestamp: Date.now() };
  conv.messages.push(userMsg);
  if (conv.messages.length === 1) conv.title = text.length > 40 ? text.slice(0, 40) + '...' : text;
  saveConversations();

  appendMessageHTML(userMsg, conv.messages.length - 1);
  renderHistory();

  input.value = '';
  input.style.height = 'auto';

  await getAIResponse();
  return false;
}

async function getAIResponse() {
  const conv = getCurrentConversation();
  if (!conv) return;

  setSending(true);
  const container = document.getElementById('messagesContainer');
  const typingId = 'typing-' + Date.now();
  const typingHTML = `<div class="message-wrapper bot" id="${typingId}"><div class="message"><div class="msg-avatar">PT</div><div class="msg-content-stack"><div class="msg-bubble"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div></div></div></div></div>`;
  container.insertAdjacentHTML('beforeend', typingHTML);
  scrollToBottom();

  const apiMessages = [{ role: 'system', content: PTBOT_SYSTEM_PROMPT }];
  const recent = conv.messages.slice(-20);
  for (const m of recent) {
    if (m && (m.role === 'user' || m.role === 'assistant') && m.content) {
      apiMessages.push({ role: m.role, content: m.content });
    }
  }

  state.abortController = new AbortController();

  try {
    const data = await callAPI(apiMessages, state.abortController.signal);
    const typingEl = document.getElementById(typingId);
    if (typingEl) typingEl.remove();

    let content = '';
    if (data && data.choices && data.choices[0]) {
      content = data.choices[0].message?.content || data.choices[0].text || '';
    } else if (data && data.message) {
      content = data.message.content || '';
    } else if (data && data.content) {
      content = data.content;
    }

    if (!content || !content.trim()) {
      throw new Error('Phản hồi rỗng từ AI. Vui lòng thử lại.');
    }

    content = sanitizeResponse(content);
    const aiMsg = { role: 'assistant', content: content, timestamp: Date.now() };
    conv.messages.push(aiMsg);
    saveConversations();
    appendMessageHTML(aiMsg, conv.messages.length - 1);
    renderHistory();
  } catch (err) {
    console.error('API error:', err);
    const typingEl = document.getElementById(typingId);
    if (typingEl) typingEl.remove();

    let errTitle = 'PTBot chưa thể phản hồi';
    let canRetry = true;

    if (err.name === 'AbortError') {
      errTitle = 'Đã hủy yêu cầu';
      canRetry = false;
    } else if (err.message.includes('NetworkError') || err.message.includes('Failed to fetch')) {
      errTitle = 'Lỗi mạng — không kết nối được server';
    } else if (err.message.includes('401') || err.message.includes('Authentication')) {
      errTitle = 'API key không hợp lệ';
      canRetry = false;
    } else if (err.message.includes('429')) {
      errTitle = 'Quá nhiều yêu cầu — vui lòng đợi';
    } else if (err.message.includes('500') || err.message.includes('502') || err.message.includes('503')) {
      errTitle = 'Server đang gặp sự cố';
    }

    showErrorInChat(errTitle, err.message, canRetry);
    showToast('Lỗi: ' + (errTitle || 'Không rõ'));
  } finally {
    state.abortController = null;
    setSending(false);
  }
}

async function retryLastMessage() {
  const conv = getCurrentConversation();
  if (!conv || conv.messages.length === 0) return;
  const last = conv.messages[conv.messages.length - 1];
  if (last.role === 'user') {
    await getAIResponse();
  } else {
    conv.messages.pop();
    saveConversations();
    renderChat();
    await getAIResponse();
  }
}

function copyMessage(idx) {
  const conv = getCurrentConversation();
  if (!conv || !conv.messages[idx]) return;
  copyToClipboard(conv.messages[idx].content);
}

async function regenerateMessage(idx) {
  const conv = getCurrentConversation();
  if (!conv || state.isStreaming) return;
  for (let i = conv.messages.length - 1; i >= idx; i--) {
    if (conv.messages[i].role === 'assistant') { conv.messages.splice(i, 1); break; }
  }
  saveConversations(); renderChat();
  await getAIResponse();
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebarOverlay');
  if (sb) sb.classList.toggle('open');
  if (ov) ov.classList.toggle('active');
}

// ═══════════════════════════════════════════════════════════════════════════
// EVENT HANDLERS — gắn chắc chắn sau khi DOM sẵn sàng
// ═══════════════════════════════════════════════════════════════════════════
function attachEvents() {
  const form = document.getElementById('chatForm');
  const input = document.getElementById('messageInput');
  if (!form || !input) { console.error('Form/input not found'); return; }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    sendMessage(e);
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      sendMessage();
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== input && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) {
      e.preventDefault();
      input.focus();
    }
  });
}

(function init() {
  try {
    const ids = Object.keys(state.conversations);
    if (ids.length > 0) state.currentId = ids.sort((a, b) => state.conversations[b].createdAt - state.conversations[a].createdAt)[0];
    renderChat(); renderHistory();
    attachEvents();
    setTimeout(() => { const i = document.getElementById('messageInput'); if (i) i.focus(); }, 100);
    console.log('PTBot initialized. Model:', API_CONFIG.model);
  } catch (e) {
    console.error('Init error:', e);
    const c = document.getElementById('messagesContainer');
    if (c) c.innerHTML = '<div style="padding:40px;text-align:center;color:var(--error);">Lỗi khởi tạo. Vui lòng tải lại trang.</div>';
  }
})();
</script>
